{% extends "base.html" %}

{% block CSS_outra_pagina %}
<link rel="stylesheet" href="/static/css/editar-ponto.css">
{% endblock %}

{% block main %}

<button class="btn-editar" type="button">Editar</button>

<!--placeholder para testar backend de edicao-->


<form action="/editar/{{ ponto.id }}" method="POST">
    <input name="nome" value="{{ ponto.nome }}">
    <input name="endereco" value="{{ ponto.endereco }}">
    <input name="residuo" value="{{ ponto.residuo }}">
    <input name="detalhe" value="{{ ponto.detalhe }}">
    <input name="cep" value="{{ ponto.cep }}">
    <input name="contato" value="{{ ponto.contato }}">
      <label for="ativo">
      <input type="checkbox" id="ativo" name="ativo" value="True">
      Ponto ativo
    </label>
    <button type="submit">Salvar alterações</button>
</form>

{% endblock %}

{% with mensagens = get_flashed_messages(with_categories=true) %}
  {% if mensagens %}
    {% for categoria, texto in mensagens %}
      <p class="{{ categoria }}">{{ texto }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}
