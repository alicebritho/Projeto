<!--placeholder para testar backend-->

<form action="/cadastro" method="POST">
    <input name="nome" placeholder="invente um nome">
    <input name="endereco" placeholder="invente um endereço">
    <input name="residuo" placeholder="invente um lixo">
    <input name="detalhe" placeholder="invente uma mensagem">
    <input name="cep" placeholder="invente um CEP">
    <input name="contato" placeholder="invente um contato">
    <button type="submit">Enviar</button>
</form>

{% with mensagens = get_flashed_messages(with_categories=true) %}
  {% if mensagens %}
    {% for categoria, texto in mensagens %}
      <p class="{{ categoria }}">{{ texto }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}
